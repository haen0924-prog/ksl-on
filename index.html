<style>
/* ── 리셋 & 루트 ─────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #fdf8f0;
  --cream: #fff9f0;
  --ink: #1c1410;
  --ink2: #5a4a3a;
  --border: #e8ddd0;

  /* 메뉴별 색상 */
  --c1: #e8523a;   /* 강원수어뉴스 — 붉은 주황 */
  --c2: #3a9e6e;   /* 톡톡정보 — 초록 */
  --c3: #3a6ee8;   /* 톡톡수어 — 파랑 */
  --c4: #c87e1a;   /* 기타영상 — 황금 */

  --c1-light: #fff0ed;
  --c2-light: #edfff6;
  --c3-light: #edf3ff;
  --c4-light: #fff8ed;

  --radius: 16px;
  --fan-duration: 0.45s;
}

html, body {
  width: 100%; min-height: 100vh;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
}

/* ── 배경 패턴 ────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(232,82,58,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(58,110,232,0.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(200,126,26,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

/* ── 헤더 ─────────────────────────────────────── */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 60px;
  background: rgba(10,10,10,0.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.25);
}

.site-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  background: linear-gradient(120deg, var(--c1), var(--c3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-btns { display:flex; gap:8px; align-items:center; }
.btn-outline { background: transparent; color: #ccc; border: 1.5px solid rgba(255,255,255,0.2); }
.btn-outline:hover { border-color: var(--c3); color: #fff; }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: none; font-family: inherit; transition: all 0.18s;
}
.btn-outline {
  background: transparent; color: var(--ink2);
  border: 1.5px solid var(--border);
}
.btn-outline:hover { border-color: var(--c3); color: var(--c3); }
.btn-primary {
  background: var(--c3); color: #fff;
}
.btn-primary:hover { background: #2a5fd8; transform: translateY(-1px); }
.btn-danger-sm {
  background: transparent; color: #d03020; border: none;
  padding: 3px 8px; font-size: 12px; cursor: pointer; border-radius: 5px;
  font-family: inherit;
}
.btn-danger-sm:hover { background: rgba(208,48,32,0.08); }

/* ── 홈 화면 ──────────────────────── */
#homeScreen {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 24px 48px;
}

.home-subtitle {
  font-size: 14px; color: var(--ink2);
  margin-bottom: 10px; letter-spacing: 0.5px;
  opacity: 0;
  animation: fadeUp 0.6s 0.2s ease forwards;
}
.home-lead {

      <button class="btn btn-outline" onclick="closeAdmin()">닫기</button>
      <button class="btn btn-primary" id="adminLoginBtn" onclick="loginAdmin()">확인</button>
      <button class="btn" id="adminLogoutBtn" style="display:none; background:#fee; color:#d03020; border:none;" onclick="logoutAdmin()">로그아웃</button>
    </div>

    <!-- 관리자 전용: 비밀번호 변경 -->
    <div id="adminExtra" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
      <div class="admin-row">
        <label class="admin-label">새 비밀번호 변경</label>
        <input class="admin-input" id="newPwInput" type="password" placeholder="새 비밀번호">
      </div>
      <div style="text-align:right;">
        <button class="btn btn-primary" onclick="changePw()" style="border-radius:8px;">변경</button>
      </div>
    </div>
  </div>
</div>

<!-- ── 토스트 ──────────────────────────────────── -->
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════
   데이터 구조 & 초기화
══════════════════════════════════════════════ */
const STORAGE_KEY = 'sueo_v2';
const DEFAULT_PW   = 'admin1234';

const MENUS = [
  {
    id: 'news', name: '강원수어뉴스', emoji: '📰',
    desc: '강원도 수어 뉴스 & 현장 영상',
    color: 'var(--c1)', light: 'var(--c1-light)',
    defaultCats: ['수어뉴스', '생생현장', '코로나19 수어브리핑']
  },
  {
    id: 'info', name: '톡톡정보', emoji: '💡',
    desc: '지명수어, 정보영상',
    color: 'var(--c2)', light: 'var(--c2-light)',
    defaultCats: ['지명수어', '정보영상']
  },
  {
    id: 'sign', name: '톡톡수어', emoji: '🤟',
    desc: '연도별 수어 영상 모음',
    color: 'var(--c3)', light: 'var(--c3-light)',
    defaultCats: ['2026','2025','2024','2023','2022','2021','2020','2019','2018','2017','2016']
  },
  {
    id: 'etc', name: '기타영상', emoji: '🎬',
    desc: '교육, 행사 및 기타 영상',
    color: 'var(--c4)', light: 'var(--c4-light)',
    defaultCats: ['교육 및 행사', '기타영상']
  }
];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  // 초기 데이터
  const d = { pw: DEFAULT_PW, menus: {}, videos: [] };
  MENUS.forEach(m => { d.menus[m.id] = [...m.defaultCats]; });
  return d;
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

let db = loadData();

// 관리자 세션 (새로고침시 초기화)
let isAdmin = false;

/* ══════════════════════════════════════════════
   유틸
══════════════════════════════════════════════ */
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ytId(url) {
  url = url.trim();
  const m = url.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (url.match(/^[A-Za-z0-9_-]{11}$/) ? url : null);
}
function thumb(vid) { return `https://img.youtube.com/vi/${vid}/hqdefault.jpg`; }
function embedUrl(vid) { return `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0`; }

let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ══════════════════════════════════════════════
   홈 화면 — 부채
══════════════════════════════════════════════ */
let fanOpen = false;

function initFan() {
  MENUS.forEach((m, i) => {
    const cnt = db.videos.filter(v => v.menu === m.id).length;
    document.getElementById(`cnt${i}`).textContent = cnt + '편';
  });
}

/* ══════════════════════════════════════════════
   서브 카테고리 패널
══════════════════════════════════════════════ */
let currentMenuIdx = -1;

function openSubPanel(menuIdx) {
  currentMenuIdx = menuIdx;
  const m = MENUS[menuIdx];
  const cats = db.menus[m.id];

  // 헤더
  const icon = document.getElementById('subIcon');
  icon.textContent = m.emoji;
  icon.style.background = m.light;

  document.getElementById('subMenuName').textContent = m.name;
  document.getElementById('subMenuName').style.color = m.color;
  document.getElementById('subMenuDesc').textContent = m.desc;

  renderSubCats(menuIdx);

  document.getElementById('subPanel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderSubCats(menuIdx) {
  const m = MENUS[menuIdx];
  const cats = db.menus[m.id];
  const container = document.getElementById('subCats');

  container.innerHTML = cats.map(cat => {
    const cnt = db.videos.filter(v => v.menu === m.id && v.cat === cat).length;
    return `
      <button class="sub-cat-btn" onclick="selectCat(${menuIdx},'${escH(cat)}')"
              style="border-color:${m.color}20; color:${m.color}">
        <span class="sub-cat-dot" style="background:${m.color}"></span>
        <span>${escH(cat)}</span>
        <span class="sub-cat-count">${cnt}</span>
        <button class="sub-cat-del" onclick="event.stopPropagation();delSubCat(${menuIdx},'${escH(cat)}')" title="삭제">✕</button>
      </button>`;
  }).join('');
}

function closeSubPanel() {
  document.getElementById('subPanel').classList.remove('open');
  document.body.style.overflow = '';
}

function closeSubIfBack(e) {
  if (e.target === document.getElementById('subPanel')) closeSubPanel();
}

function addSubCat() {
  const input = document.getElementById('subAddInput');
  const name = input.value.trim();
  if (!name) return;
  const m = MENUS[currentMenuIdx];
  if (db.menus[m.id].includes(name)) { showToast('이미 있는 카테고리입니다.', 'error'); return; }
  db.menus[m.id].push(name);
  saveData();
  input.value = '';
  renderSubCats(currentMenuIdx);
  showToast(`"${name}" 추가됨`, 'success');
}

function delSubCat(menuIdx, cat) {
  if (!confirm(`"${cat}" 카테고리와 영상을 삭제할까요?`)) return;
  const m = MENUS[menuIdx];
  db.menus[m.id] = db.menus[m.id].filter(c => c !== cat);
  db.videos = db.videos.filter(v => !(v.menu === m.id && v.cat === cat));
  saveData();
  renderSubCats(menuIdx);
  initFan();
  showToast('삭제됨', 'error');
}

/* ══════════════════════════════════════════════
   카테고리 선택 → 영상 목록
══════════════════════════════════════════════ */
let currentMenu = null;
let currentCat  = null;

function selectCat(menuIdx, cat) {
  currentMenu = MENUS[menuIdx];
  currentCat  = cat;
  closeSubPanel();

  document.getElementById('homeScreen').style.display = 'none';
  const vs = document.getElementById('videoScreen');
  vs.classList.add('active');

  // 브레드크럼
  document.getElementById('bMenu').textContent = currentMenu.name;
  document.getElementById('bCat').textContent  = cat;

  // 제목 색상
  const title = document.getElementById('vsTitle');
  title.textContent = cat;
  title.style.color = currentMenu.color;

  // 관리자 버튼
  document.getElementById('addVideoBtn').style.display = isAdmin ? '' : 'none';

  renderVideos();
}

function goHome() {
  document.getElementById('videoScreen').classList.remove('active');
  document.getElementById('homeScreen').style.display = '';
  document.getElementById('addForm').classList.remove('open');
  document.getElementById('addVideoBtn').style.display = 'none';
  currentMenu = null; currentCat = null;
  initFan();
}

function openSubFromBread() {
  if (currentMenu) {
    const idx = MENUS.findIndex(m => m.id === currentMenu.id);
    openSubPanel(idx);
  }
}

/* ══════════════════════════════════════════════
   영상 렌더
══════════════════════════════════════════════ */
function renderVideos() {
  const filtered = db.videos.filter(v => v.menu === currentMenu.id && v.cat === currentCat);
  const grid  = document.getElementById('videoGrid');
  const empty = document.getElementById('emptyState');
  const cnt   = document.getElementById('vsCount');

  cnt.textContent = `영상 ${filtered.length}개`;

  if (filtered.length === 0) {
    grid.innerHTML = ''; empty.style.display = 'block'; return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.slice().reverse().map(v => `
    <div class="video-card" onclick="playVideo('${escH(v.id)}','${escH(v.title)}')">
      <div class="thumb-wrap">
        <img src="${thumb(v.vid)}" alt="${escH(v.title)}"
             onerror="this.src='https://img.youtube.com/vi/${v.vid}/mqdefault.jpg'">
        <div class="play-overlay">
          <div class="play-icon" style="color:${currentMenu.color}">▶</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${escH(v.title)}</div>
        <div class="card-meta">
          <span class="card-date">${v.date}</span>
          ${isAdmin ? `<button class="btn-danger-sm" onclick="event.stopPropagation();delVideo('${escH(v.id)}')">삭제</button>` : ''}
        </div>
      </div>
    </div>`).join('');
}

/* ══════════════════════════════════════════════
   영상 추가 / 삭제
══════════════════════════════════════════════ */
let addFormOpen = false;
function toggleAddForm() {
  addFormOpen = !addFormOpen;
  document.getElementById('addForm').classList.toggle('open', addFormOpen);
}

function addVideo() {
  const urlVal   = document.getElementById('urlInput').value.trim();
  const titleVal = document.getElementById('titleInput').value.trim();
  if (!urlVal) { showToast('URL을 입력해 주세요.', 'error'); return; }
  const vid = ytId(urlVal);
  if (!vid) { showToast('유효한 유튜브 URL이 아닙니다.', 'error'); return; }

  const v = {
    id:    Date.now().toString(),
    vid,
    title: titleVal || `영상 (${vid})`,
    menu:  currentMenu.id,
    cat:   currentCat,
    date:  new Date().toLocaleDateString('ko-KR')
  };
  db.videos.push(v);
  saveData();

  document.getElementById('urlInput').value   = '';
  document.getElementById('titleInput').value = '';
  toggleAddForm();
  renderVideos();
  initFan();
  showToast('등록됐습니다!', 'success');
}

function delVideo(id) {
  if (!confirm('삭제할까요?')) return;
  db.videos = db.videos.filter(v => v.id !== id);
  saveData();
  renderVideos();
  initFan();
  showToast('삭제됨', 'error');
}

/* ══════════════════════════════════════════════
   영상 재생
══════════════════════════════════════════════ */
function playVideo(id, title) {
  const v = db.videos.find(v => v.id === id);
  if (!v) return;
  document.getElementById('playerTitle').textContent = decodeURIComponent(title.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'));
  document.getElementById('playerIframe').src = embedUrl(v.vid);
  document.getElementById('playerModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePlayer() {
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('playerIframe').src = '';
  document.body.style.overflow = '';
}
function closePlayerIfBack(e) {
  if (e.target === document.getElementById('playerModal')) closePlayer();
}

/* ══════════════════════════════════════════════
   관리자
══════════════════════════════════════════════ */
function openAdmin() {
  document.getElementById('adminPwInput').value = '';
  document.getElementById('adminStatus').textContent = isAdmin ? '현재 관리자 모드입니다.' : '';
  document.getElementById('adminLoginBtn').style.display  = isAdmin ? 'none' : '';
  document.getElementById('adminLogoutBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('adminExtra').style.display     = isAdmin ? '' : 'none';
  document.getElementById('adminPanel').classList.add('open');
}
function closeAdmin() {
  document.getElementById('adminPanel').classList.remove('open');
}
function closeAdminIfBack(e) {
  if (e.target === document.getElementById('adminPanel')) closeAdmin();
}

function loginAdmin() {
  const pw = document.getElementById('adminPwInput').value;
  if (pw === db.pw) {
    isAdmin = true;
    document.body.classList.add('admin-mode');
    if (currentMenu) document.getElementById('addVideoBtn').style.display = '';
    document.getElementById('adminLogoutHeaderBtn').style.display = '';
    if (currentCat)  renderVideos();
    closeAdmin();
    showToast('관리자 모드 활성화 ✓', 'success');
  } else {
    document.getElementById('adminStatus').textContent = '비밀번호가 틀렸습니다.';
    document.getElementById('adminStatus').style.color = '#d03020';
  }
}

function logoutAdmin() {
  isAdmin = false;
  document.body.classList.remove('admin-mode');
  document.getElementById('addVideoBtn').style.display = 'none';
  document.getElementById('adminLogoutHeaderBtn').style.display = 'none';
  if (currentCat) renderVideos();
  closeAdmin();
  showToast('관리자 모드 해제');
}

function changePw() {
  const np = document.getElementById('newPwInput').value.trim();
  if (np.length < 4) { showToast('4자 이상 입력해 주세요.', 'error'); return; }
  db.pw = np;
  saveData();
  document.getElementById('newPwInput').value = '';
  showToast('비밀번호가 변경됐습니다.', 'success');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePlayer(); closeAdmin(); closeSubPanel(); }
});

/* ══════════════════════════════════════════════
   시작
══════════════════════════════════════════════ */
initFan();

// URL에 ?admin 이 있으면 관리자 패널 자동 오픈
if (location.search.includes('admin')) {
  openAdmin();
}
</script>
</body>
</html>
